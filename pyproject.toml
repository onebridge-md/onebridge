[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onebridge"
version = "0.1.0"
description = "Bridge CLI and access layer for Microsoft OneNote via Microsoft Graph API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "msal>=1.28.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "cryptography>=42.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "textual>=0.70.0",
]

[project.scripts]
onebridge = "onebridge.cli.main:cli"
onenote = "onebridge.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
